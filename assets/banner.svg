<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="ExoMind — portable knowledge runtime for Pi, Hermes, OpenClaw and Codex">
  <defs>
    <linearGradient id="accent" x1="76" y1="109" x2="128" y2="161" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7AA2FF"/>
      <stop offset="1" stop-color="#70E1FF"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="300" fill="#06070A"/>
  <rect x="0.5" y="0.5" width="1279" height="299" stroke="#161922"/>

  <!-- mark: ring + nodes -->
  <circle cx="102" cy="135" r="26" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="1.4"/>
  <g stroke="#8FA8E8" stroke-opacity="0.25" stroke-width="1">
    <path d="M102 135L128 135M102 135L89 158M102 135L89 112"/>
  </g>
  <g fill="#8FA8E8">
    <circle cx="115" cy="158" r="2.5"/>
    <circle cx="89" cy="158" r="2.5"/>
    <circle cx="76" cy="135" r="2.5"/>
    <circle cx="89" cy="112" r="2.5"/>
    <circle cx="115" cy="112" r="2.5"/>
  </g>
  <circle cx="128" cy="135" r="5" fill="url(#accent)"/>
  <circle cx="102" cy="135" r="3.6" fill="#C9D6FF"/>

  <!-- lockup -->
  <text x="158" y="162" fill="#F4F7FF" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-3">ExoMind</text>
  <text x="160" y="192" fill="#6B7488" font-family="JetBrains Mono, Consolas, ui-monospace, monospace" font-size="13" letter-spacing="2.4">PORTABLE KNOWLEDGE RUNTIME</text>
  <text x="160" y="212" fill="#3F4757" font-family="JetBrains Mono, Consolas, ui-monospace, monospace" font-size="10.5" letter-spacing="1.8">PI · HERMES · OPENCLAW · CODEX</text>

  <!-- usage column -->
  <g font-family="JetBrains Mono, Consolas, ui-monospace, monospace" font-size="12.5" text-anchor="end">
    <text x="1208" y="126" fill="#4A5468">exom index --notes-root ~/vault</text>
    <text x="1208" y="148" fill="#4A5468">exom recall --query "session context"</text>
  </g>

  <path d="M72 234H1208" stroke="#161922"/>

  <text x="72" y="264" fill="#4A5468" font-family="JetBrains Mono, Consolas, ui-monospace, monospace" font-size="11.5" letter-spacing="1.8">MIT · LOCAL-FIRST · RUST CORE</text>
  <text x="1208" y="264" fill="#3A4152" font-family="JetBrains Mono, Consolas, ui-monospace, monospace" font-size="11" letter-spacing="1.2" text-anchor="end">by zhugez</text>
</svg>
